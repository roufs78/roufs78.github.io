<!doctype html><html lang="id"><head><meta charset="utf-8">

<link rel="manifest" href="manifest.json">

<style>
:root{--bg:#f3eee4;--c:#fffaf0;--t:#2b2118;--m:#7a6a58;--a:#8a3b1f;--l:#e0d5c2}
@media(prefers-color-scheme:dark){:root{--bg:#1c1712;--c:#2a231b;--t:#f1e8d8;--m:#a99a86;--a:#e0895f;--l:#3d3326}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:16px}h1{font:600 22px Georgia,serif;margin:4px 0 12px}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin:12px 0}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.g b{font-size:12px;color:var(--m);padding:4px 0}
.d{border:0;background:none;color:var(--t);border-radius:10px;padding:6px 0;font:inherit;min-height:48px}
.d small{display:block;font-size:10px;color:var(--m)}.d.t{outline:2px solid var(--a)}.d.s{background:var(--a);color:#fff}.d.s small{color:#fff}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
button.b{background:var(--a);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit}
input{width:100%;padding:10px;border:1px solid var(--l);border-radius:10px;background:var(--c);color:var(--t);font:inherit;margin:4px 0 10px}
h2{margin:0 0 4px;font:600 20px Georgia,serif;color:var(--a)}p{margin:6px 0;line-height:1.5}.m{color:var(--m);font-size:14px}
.d.h{color:#e5534b}.d.c{color:#e0a030}.d.s{color:#fff!important}.hl{display:flex;gap:8px;margin:3px 0}.hl b{min-width:26px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--m);padding:14px 0;font:inherit}nav .on{color:var(--a);font-weight:600}
</style></head><body><main id="app"></main><nav id="nav"></nav>
<script>
const DATA={"b8": [{"nama": "Pesthi", "arti": "Pasti dan menetap. Rumah tangga diyakini tenang dan rukun; soal yang datang tidak sampai meretakkannya."}, {"nama": "Pegat", "arti": "Artinya putus. Primbon mengingatkan ujian yang bisa menggoyangkan ikatan — uang, kesibukan, atau campur tangan luar. Ini ajakan saling menjaga, bukan vonis."}, {"nama": "Ratu", "arti": "Pasangan yang disegani. Dihormati kerabat dan tetangga karena sikap saling menghargai."}, {"nama": "Jodoh", "arti": "Dianggap cocok secara alami. Mampu menerima kelebihan dan kekurangan satu sama lain sampai usia lanjut."}, {"nama": "Topo", "arti": "Dari kata tapa. Awal bersama diyakini prihatin, lalu menjadi ringan setelah dilewati berdua."}, {"nama": "Tinari", "arti": "Rezeki diyakini lancar. Pasangan jarang kekurangan dan mudah menemukan nafkah."}, {"nama": "Padu", "arti": "Artinya bantah. Sering beda pendapat pada hal kecil, tetapi dalam primbon pertengkaran ini tidak sampai memisahkan."}, {"nama": "Sujanan", "arti": "Ujiannya pada rasa percaya: cemburu, godaan, atau orang ketiga. Ikatan kuat bila kesetiaan dijaga dua arah."}], "b5": [{"nama": "Pati", "arti": "Lambang masa yang berat atau rezeki yang perlu dijaga. Dalam tradisi ini bukan ramalan kematian, melainkan isyarat untuk lebih berhati-hati dan saling menopang."}, {"nama": "Sri", "arti": "Kelimpahan pangan. Kebutuhan harian diyakini tercukupi."}, {"nama": "Lungguh", "arti": "Kedudukan. Primbon mengaitkannya dengan kehormatan atau tempat yang diakui di lingkungan."}, {"nama": "Gedhong", "arti": "Artinya gedung atau simpanan. Kecenderungan menata rumah, harta, dan aset secara nyata."}, {"nama": "Lara", "arti": "Isyarat untuk menjaga kesehatan. Bukan vonis sakit, melainkan pengingat merawat tubuh."}], "watak": {"0-0": {"sifat": "Berwibawa dan terbuka", "uraian": "Senang memimpin tanpa banyak perintah. Orang lain mudah percaya karena sikapnya hangat, meski pendiriannya tetap dijaga."}, "0-1": {"sifat": "Ramah dan mudah akrab", "uraian": "Cepat berteman dan suka menolong. Perlu dijaga agar janji tidak lebih banyak daripada tenaga."}, "0-2": {"sifat": "Tenang dan berpikir panjang", "uraian": "Tidak tergesa mengambil sikap. Setia, tetapi bisa terlalu lama menyimpan perasaan."}, "0-3": {"sifat": "Sederhana dan teguh", "uraian": "Hidup hemat dan kerja yang rapi, tanpa suka pamer. Kekuatannya ada pada konsistensi, bukan keramaian."}, "0-4": {"sifat": "Halus dan peka suasana", "uraian": "Cepat membaca perasaan orang di sekitarnya. Perlu waktu sendiri supaya tidak lelah secara batin."}, "1-0": {"sifat": "Cermat dan bertanggung jawab", "uraian": "Menyukai keteraturan dan menepati tugas. Bisa terasa kaku bila semua harus menurut aturan."}, "1-1": {"sifat": "Cerdas dan penuh gagasan", "uraian": "Cepat menangkap hal baru dan senang belajar. Gelisah jika terlalu lama tinggal di tempat yang sama."}, "1-2": {"sifat": "Sabar dan penyayang", "uraian": "Menjaga hubungan dengan lembut dan menghindari keributan. Sering mengalah lebih dulu supaya suasana tetap baik."}, "1-3": {"sifat": "Mandiri dan praktis", "uraian": "Sedikit bicara, banyak kerja. Prinsipnya kuat dan tidak mudah dibujuk oleh pujian."}, "1-4": {"sifat": "Lembut dan suka merenung", "uraian": "Peka pada perasaan orang lain. Semangatnya naik turun, jadi ritme hari perlu dijaga."}, "2-0": {"sifat": "Lincah dan terus terang", "uraian": "Berani memulai dan berbicara apa adanya. Cepat bosan pada urusan yang berlarut-larut."}, "2-1": {"sifat": "Bersemangat dan dermawan", "uraian": "Energi tinggi, suka bersaing secara sehat, dan ringan tangan. Emosi perlu dijaga supaya tidak tersulut hal kecil."}, "2-2": {"sifat": "Ulet dan teliti", "uraian": "Nyaman dengan pekerjaan yang butuh kesabaran. Pendiam, tetapi hasilnya biasanya rapi."}, "2-3": {"sifat": "Tahan banting", "uraian": "Neptu 7 adalah yang terendah. Dalam primbon ia tidak dianggap lemah: sederhana, tidak menonjol, dan rezekinya pelan tetapi stabil."}, "2-4": {"sifat": "Tegas dan pelindung", "uraian": "Berdiri di depan saat orang dekatnya butuh sandaran. Bisa keras jika merasa disakiti."}, "3-0": {"sifat": "Lincah bicara", "uraian": "Pandai mencairkan suasana dan mudah menyesuaikan diri. Perlu satu pendirian yang dipegang supaya tidak terlihat plin-plan."}, "3-1": {"sifat": "Besar cita-cita", "uraian": "Neptu 16. Ambisius dan disegani, dengan pandangan yang jauh. Ego perlu diimbangi supaya orang di sampingnya tetap nyaman."}, "3-2": {"sifat": "Adil dan dipercaya", "uraian": "Sering diminta menengahi. Tenangnya membuat orang merasa aman, asalkan tidak menanggung semua beban sendiri."}, "3-3": {"sifat": "Hemat dan teratur", "uraian": "Suka rencana yang jelas dan hati-hati mengambil risiko. Kadang sulit mengubah kebiasaan yang sudah mapan."}, "3-4": {"sifat": "Dalam rasa", "uraian": "Butuh ruang untuk mengolah perasaan. Orang dekatnya merasakan kehangatan yang tidak selalu diucapkan."}, "4-0": {"sifat": "Murah hati dan optimistis", "uraian": "Senang berkumpul dan berbagi. Perlu batas agar kebaikan tidak menjadi boros."}, "4-1": {"sifat": "Pemimpin berneptu tinggi", "uraian": "Neptu 17. Dalam primbon ini weton yang berat dan disegani: pengaruhnya besar, begitu pula tanggung jawabnya."}, "4-2": {"sifat": "Bijak dan tegas pada aturan", "uraian": "Suka menasihati dengan tenang. Bisa terasa keras bila prinsipnya dilanggar."}, "4-3": {"sifat": "Jujur dan tidak banyak omong", "uraian": "Kerja yang bisa diandalkan. Kesetiaannya terlihat dari kehadiran, bukan dari kata-kata."}, "4-4": {"sifat": "Kharismatik dan peka batin", "uraian": "Dihormati karena sikapnya yang tenang. Mudah menyerap suasana orang lain, jadi perlu istirahat batin."}, "5-0": {"sifat": "Lembut dan penyabar", "uraian": "Nyaman dalam suasana yang tidak gaduh. Menghindar dari keramaian yang berlebihan."}, "5-1": {"sifat": "Murah rezeki untuk dibagi", "uraian": "Senang berbagi dan mudah terhubung dengan orang. Perlu batas supaya tidak kehabisan untuk diri sendiri."}, "5-2": {"sifat": "Teguh dan pendiam", "uraian": "Prinsipnya dijaga tanpa banyak pengumuman. Orang percaya karena ia konsisten."}, "5-3": {"sifat": "Sederhana dan ikhlas", "uraian": "Tidak neko-neko. Hidupnya terasa tenang bila tidak terus dibandingkan dengan orang lain."}, "5-4": {"sifat": "Penyayang dan intuitif", "uraian": "Dekat dengan keluarga dan mudah iba. Perlu membedakan mana yang bisa ditolong dan mana yang harus dilepas."}, "6-0": {"sifat": "Pemberani dan blak-blakan", "uraian": "Melindungi orang yang dianggapnya benar. Kata-katanya lugas, kadang perlu dilembutkan."}, "6-1": {"sifat": "Neptu paling besar", "uraian": "Neptu 18, yang tertinggi. Kemauan keras dan pengaruhnya terasa. Dalam primbon, rezeki dan ujian datang sama-sama besar."}, "6-2": {"sifat": "Disiplin dan tidak suka ditunda", "uraian": "Nyaman memimpin kerja yang nyata. Orang di sekitarnya butuh tempo yang jelas."}, "6-3": {"sifat": "Pendiam tetapi kuat", "uraian": "Setia dan jarang mengeluh. Kekuatannya tidak selalu terlihat dari luar."}, "6-4": {"sifat": "Disegani", "uraian": "Neptu 17. Dalam primbon, Sabtu Kliwon berwibawa dan dikaitkan dengan keteguhan batin. Amarahnya, bila dibiarkan, juga besar."}}};
const HY={2026:"01-01 Tahun Baru 2026|01-16 Isra Mikraj|02-16 *Cuti Imlek|02-17 Tahun Baru Imlek|03-18 *Cuti Nyepi|03-19 Hari Suci Nyepi|03-20 *Cuti Idulfitri|03-21 Idulfitri 1447 H|03-22 Idulfitri 1447 H|03-23 *Cuti Idulfitri|03-24 *Cuti Idulfitri|04-03 Wafat Yesus Kristus|04-05 Paskah|05-01 Hari Buruh|05-14 Kenaikan Yesus Kristus|05-15 *Cuti Kenaikan Yesus|05-27 Iduladha 1447 H|05-28 *Cuti Iduladha|05-31 Hari Raya Waisak|06-01 Hari Lahir Pancasila|06-16 Tahun Baru Islam 1448 H|08-17 Hari Kemerdekaan RI|08-25 Maulid Nabi|12-24 *Cuti Natal|12-25 Hari Natal",
2027:"01-01 Tahun Baru 2027|01-05 Isra Mikraj|02-05 *Cuti Imlek|02-06 Tahun Baru Imlek|03-08 Hari Suci Nyepi|03-09 *Cuti Idulfitri|03-10 Idulfitri 1448 H|03-11 Idulfitri 1448 H|03-12 *Cuti Idulfitri|03-15 *Cuti Idulfitri|03-25 *Cuti Wafat Yesus|03-26 Wafat Yesus Kristus|03-28 Paskah|05-01 Hari Buruh|05-06 Kenaikan Yesus Kristus|05-17 Iduladha 1448 H|05-18 *Cuti Iduladha|05-19 *Cuti Waisak|05-20 Hari Raya Waisak|06-01 Hari Lahir Pancasila|06-06 Tahun Baru Islam 1449 H|08-15 Maulid Nabi|08-17 Hari Kemerdekaan RI|12-24 *Cuti Natal|12-25 Hari Natal|12-26 Isra Mikraj"},
HF="01-01 Tahun Baru|05-01 Hari Buruh|06-01 Hari Lahir Pancasila|08-17 Hari Kemerdekaan RI|12-25 Hari Natal",HM={};
for(const y in HY)HY[y].split("|").forEach(s=>{const r=/^(\d\d-\d\d) (\*?)(.*)$/.exec(s);HM[y+"-"+r[1]]={n:r[3],c:!!r[2]}});
const hol=c=>{const k=String(c.y)+"-"+String(c.m).padStart(2,"0")+"-"+String(c.d).padStart(2,"0");if(HM[k])return HM[k];if(HY[c.y])return null;
const f=HF.split("|").find(s=>s.slice(0,5)==k.slice(5));return f?{n:f.slice(6),c:false}:null};
function hij(c){const t=new Date(U(c.y,c.m,c.d));for(const k of["islamic-umalqura","islamic-civil"])try{const p=new Intl.DateTimeFormat("id-u-ca-"+k,{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).formatToParts(t),g=x=>(p.find(q=>q.type===x)||{}).value;return g("day")+" "+g("month")+" "+String(g("year")).replace(/\D/g,"")+" H"}catch(e){}return""}
const D=[["Minggu","Min",5],["Senin","Sen",4],["Selasa","Sel",3],["Rabu","Rab",7],["Kamis","Kam",8],["Jumat","Jum",6],["Sabtu","Sab",9]];
const P=[["Legi","Leg",5],["Pahing","Pah",9],["Pon","Pon",7],["Wage","Wag",4],["Kliwon","Kli",8]];
const M=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const U=(y,m,d)=>Date.UTC(y,m-1,d,12),A=U(1945,8,17);
function W(y,m,d){const t=U(y,m,d),day=new Date(t).getUTCDay(),pas=((Math.round((t-A)/864e5)%5)+5)%5;
return{day,pas,n:D[day][2]+P[pas][2],l:D[day][0]+" "+P[pas][0]}}
function add(c,n){const t=new Date(U(c.y,c.m,c.d+n));return{y:t.getUTCFullYear(),m:t.getUTCMonth()+1,d:t.getUTCDate()}}
const fmt=c=>c.d+" "+M[c.m-1]+" "+c.y,iso=c=>`${c.y}-${String(c.m).padStart(2,"0")}-${String(c.d).padStart(2,"0")}`;
function parse(s){const r=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");if(!r)return null;const c={y:+r[1],m:+r[2],d:+r[3]};
return c.y>=1200&&c.y<=2400&&iso(add(c,0))===s?c:null}
function today(){const p=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Jakarta",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
const g=t=>+p.find(x=>x.type===t).value;return{y:g("year"),m:g("month"),d:g("day")}}
let st={};try{st=JSON.parse(localStorage.getItem("neptu-v1")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("neptu-v1",JSON.stringify(st))}catch(e){}};
const T=today();let tab="kal",cur=T,view={y:T.y,m:T.m};
function info(c){const w=W(c.y,c.m,c.d),k=DATA.watak[w.day+"-"+w.pas]||{sifat:"Weton",uraian:""};
return`<h2>${w.l}</h2><p class="m">${hij(c)} <small>(±1 hari dari ketetapan Kemenag)</small></p>${hol(c)?`<p><b style="color:${hol(c).c?"#e0a030":"#e5534b"}">${hol(c).n}</b></p>`:""}<p><b>Neptu ${w.n}</b> · ${D[w.day][0]} ${D[w.day][2]} + ${P[w.pas][0]} ${P[w.pas][2]}</p><p><b>${k.sifat}</b></p><p>${k.uraian}</p><p class="m">Catatan tradisi primbon, bukan vonis.</p><button class="b" onclick="share(${c.y},${c.m},${c.d})">Bagikan</button>`}
function kal(){const first=new Date(U(view.y,view.m,1)).getUTCDay(),n=new Date(U(view.y,view.m+1,0)).getUTCDate();
let h=`<h1>Kalender Neptu</h1><div class="r"><button class="b" onclick="mv(-1)">‹</button><input type="month" value="${view.y}-${String(view.m).padStart(2,"0")}" onchange="jump(this.value)" style="width:auto;margin:0"><button class="b" onclick="mv(1)">›</button></div><div class="card"><div class="g">`+D.map(d=>`<b>${d[1]}</b>`).join("");
for(let i=0;i<first;i++)h+="<span></span>";
for(let d=1;d<=n;d++){const w=W(view.y,view.m,d),c={y:view.y,m:view.m,d};
h+=`<button class="d${hol(c)?(hol(c).c?" c":" h"):""}${iso(c)==iso(T)?" t":""}${iso(c)==iso(cur)?" s":""}" onclick="pick(${d})">${d}<small>${P[w.pas][1]} ${w.n}</small></button>`}
let L=[];for(let d=1;d<=n;d++){const x=hol({y:view.y,m:view.m,d});if(x)L.push(`<div class="hl"><b>${d}</b><span>${x.n}${x.c?" (cuti bersama)":""}</span></div>`)}
h+=`</div></div>`+(L.length?`<div class="card"><b>Libur bulan ini</b>${L.join("")}</div>`:"")+(HY[view.y]?"":`<p class="m">Libur nasional tahun ini belum tersedia; hanya tanggal tetap yang tampil.</p>`);
return h+`<div class="card">${info(cur)}</div><button class="b" onclick="goto()">Hari ini</button>`}
function wet(){const c=parse(st.w)||cur,df=Math.round((U(T.y,T.m,T.d)-U(c.y,c.m,c.d))/864e5),k=((-df)%35+35)%35,nx=[0,1,2,3,4].map(i=>{const n=k+35*i;return fmt(add(T,n))+(n?" · "+n+" hari lagi":" · hari ini")});
return`<h1>Cari Weton</h1><div class="card"><label>Tanggal lahir</label><input type="date" id="w" value="${iso(c)}" onchange="st.w=this.value;save();draw()"></div><div class="card">${info(c)}</div><div class="card"><b>Weton ini jatuh lagi pada</b>${nx.map(x=>`<p>${x}</p>`).join("")}</div>`}
function jod(){const a=parse(st.a),b=parse(st.b);let r="";
if(a&&b){const x=W(a.y,a.m,a.d),y=W(b.y,b.m,b.d),t=x.n+y.n,p8=DATA.b8[t%8],p5=DATA.b5[t%5];
r=`<div class="card"><p>${x.l} (${x.n}) + ${y.l} (${y.n}) = <b>${t}</b></p><h2>${p8.nama}</h2><p>${p8.arti}</p><h2>${p5.nama}</h2><p>${p5.arti}</p><p class="m">Hiburan berdasarkan primbon, bukan penentu hubungan.</p></div>`}
return`<h1>Hitung Jodoh</h1><div class="card"><label>Tanggal lahir pertama</label><input type="date" value="${st.a||""}" onchange="st.a=this.value;save();draw()"><label>Tanggal lahir kedua</label><input type="date" value="${st.b||""}" onchange="st.b=this.value;save();draw()"></div>`+r}
function share(y,m,d){const w=W(y,m,d),k=DATA.watak[w.day+"-"+w.pas]||{sifat:"",uraian:""},t="Weton "+w.l+" (neptu "+w.n+") — "+k.sifat+". "+k.uraian;
if(navigator.share)navigator.share({title:"Kalender Neptu",text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t)}
function jump(v){const r=/^(\d{4})-(\d{2})$/.exec(v);if(r){view={y:+r[1],m:+r[2]};draw()}}
let sx=0;document.addEventListener("touchstart",e=>{sx=e.touches[0].clientX});
document.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(tab=="kal"&&Math.abs(dx)>80)mv(dx<0?1:-1)});
function mv(n){const t=new Date(U(view.y,view.m+n,1));view={y:t.getUTCFullYear(),m:t.getUTCMonth()+1};draw()}
function pick(d){cur={y:view.y,m:view.m,d};draw()}
function goto(){cur=T;view={y:T.y,m:T.m};draw()}
function draw(){document.getElementById("app").innerHTML={kal,wet,jod}[tab]();
document.getElementById("nav").innerHTML=[["kal","Kalender"],["wet","Weton"],["jod","Jodoh"]].map(t=>`<button class="${tab==t[0]?"on":""}" onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join("")}
draw();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script></body></html>
